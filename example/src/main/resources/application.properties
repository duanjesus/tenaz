spring.application.name=tenaz-orders

# How long an order waits for approval before it is refunded.
orders.approval-window=5m

# The history viewer, at /tenaz. Read-only, and unprotected: this is a demo.
tenaz.viewer.enabled=true

# Without the "postgres" profile there is no database: histories are kept in memory and are lost
# when the application stops. Run with --spring.profiles.active=postgres to make them durable.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
